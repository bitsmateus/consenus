name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: consensus
          POSTGRES_PASSWORD: consensus
          POSTGRES_DB: consensus_one_test
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]

      # object storage: os testes ponta a ponta emitem PDF e precisam guardá-lo
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: consensus
          MINIO_ROOT_PASSWORD: consensus123
          MINIO_DEFAULT_BUCKETS: consensus-one
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-retries 20
        ports: ["9000:9000"]

    env:
      DATABASE_URL: postgresql://consensus:consensus@localhost:5432/consensus_one_test
      AUTH_SECRET: chave-de-teste-nao-usar-em-producao
      AUTH_URL: http://localhost:3000
      TZ: America/Sao_Paulo
      # storage local do CI
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: br-se1
      S3_BUCKET: consensus-one
      S3_ACCESS_KEY_ID: consensus
      S3_SECRET_ACCESS_KEY: consensus123
      S3_FORCE_PATH_STYLE: "true"
      # MinIO sem KMS recusa criptografia no servidor; em produção fica ligada
      S3_CRIPTOGRAFIA: ""
      NEXT_PUBLIC_URL_VERIFICACAO: http://localhost:3000/verificar

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Lint e tipos
        run: npm run lint

      # os testes de integração e os ponta a ponta rodam contra o banco;
      # o seed cria as contas de Interessado e de Procurador que os testes de
      # isolamento usam
      - name: Dados de demonstração
        run: npm run db:seed

      - name: Testes unitários e de integração
        run: npm run test

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: npm run test:e2e

      - name: Guardar relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
