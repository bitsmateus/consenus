services:
  postgres:
    image: postgres:16-alpine
    container_name: consensus-postgres
    environment:
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
      POSTGRES_DB: consensus_one
      # UTC, igual à produção (medido: Etc/UTC). As colunas de data são
      # TIMESTAMP sem fuso, então o valor gravado é hora de parede — se o
      # banco local usasse America/Sao_Paulo, restaurar um dump de produção
      # aqui deslocaria todos os carimbos em três horas, sem erro nenhum.
      TZ: Etc/UTC
      PGTZ: Etc/UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus"]
      interval: 5s
      retries: 5

  # object storage local, compatível com a API S3 da Magalu Cloud
  minio:
    image: minio/minio:latest
    container_name: consensus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: consensus
      MINIO_ROOT_PASSWORD: consensus123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Cria o bucket na subida e sai. A imagem oficial do MinIO não cria bucket
  # nenhum sozinha, e sem ele o primeiro upload morre em NoSuchBucket — o
  # README não avisava, então clone novo não conseguia anexar documento. O CI
  # não passa por isto porque usa a imagem da bitnami, que aceita
  # MINIO_DEFAULT_BUCKETS.
  criar-bucket:
    image: minio/mc:latest
    container_name: consensus-criar-bucket
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 consensus consensus123; do
          echo "esperando o MinIO subir..."
          sleep 1
        done
        mc mb --ignore-existing local/consensus-one
        echo "bucket consensus-one pronto"

volumes:
  postgres_data:
  minio_data:
