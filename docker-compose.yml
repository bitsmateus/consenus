services:
  postgres:
    image: postgres:16-alpine
    container_name: consensus-postgres
    environment:
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
      POSTGRES_DB: consensus_one
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus"]
      interval: 5s
      retries: 5

  # object storage local, compatível com a API S3 da Magalu Cloud
  minio:
    image: minio/minio:latest
    container_name: consensus-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: consensus
      MINIO_ROOT_PASSWORD: consensus123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
